simulation:
  max_simulation_time: 1000  # Maximum simulation time in seconds
  simulation_interval: 0.1   # Simulation step interval in seconds
  traffic_interval: 0.1      # Traffic update interval in seconds

sumo:
  sumo_config: "../sumo/wujiaochang/osm.sumocfg"
  sumo_osm: "../sumo/wujiaochang/osm_bbox.osm.xml"
  sumo_net: "../sumo/wujiaochang/osm.net.xml"
  sumo_port: 8813
  export_tripinfo: False # 如果True，则导出tripinfo.xml文件（很大）
  tripinfo_output: ""

traffic:
  traffic_mode: "SUMO" # "real" or "SUMO"
  tripinfo: "./sumo_wujiaochang/tripinfo.csv" # The path to the SUMO tripinfo file
  traffic_interval: 0.1 # in seconds, for traffic simulation. Remember to set the same value in the SUMO configuration file; otherwise, the simulation will not work properly
  UAV_z_range: [100, 200] # The range of z coordinates for UAVs
  UAV_speed_range: [10,30] # The speed of UAV (distance unit per timeslot)
  UAV_traffic_file: "path/to/UAV_traffic_file.csv" # UAV traffic file
  vehicle_count: 1 # Number of vehicles to simulate
  UAV_count: 1 # Number of UAVs to simulate. UAVs are randomly generated in the simulation area initially
  distance_threshold: 0.5 # The distance threshold to check if the node is reach target position
  nonfly_zone_coordinates: [[[1000, 1200], [1200, 1200], [1200, 1000], [1000, 1000]],[[1500, 1700], [1700, 1700], [1700, 1500], [1500, 1500]]] # The non-fly zones in the simulation area, each zone is represented by a list of x1, y1, x2, y2, x3, y3 coordinates

# Task-related configuration for future expansion
task:
  num_tasks: 10 # The number of tasks to generate
  min_package_weight: 0.5 # The minimum weight of a package
  max_package_weight: 5.0 # The maximum weight of a package
  min_delivery_time: 300 # The minimum delivery time of a package
  max_delivery_time: 1800 # The maximum delivery time of a package

# State attributes for logging
state_attribute:
  log_state: false
  save_path: "logs/" 